<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reicht's? Basel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhiges Werkzeug für unterwegs, in einer Sekunde lesbar
   IDEA: Abfahrtsanzeiger – neutrale Fläche, grosse Zeiten; Farbe nur dort, wo sie etwas bedeutet
   PICTURE: die Karte mit den Fahrzeugen der gewählten Verbindung, die auf den Umsteigepunkt zufahren
   COLOUR+TYPE: neutral (Weiss/Grau); gedämpftes Schieferblau = deine Verbindung, Grau = Plan B; Grün/Gelb/Rot ausschliesslich für die Ampel
   LAYOUT: Telefon: Suche, Karte, Verbindungen gestapelt; breit: Liste links, Karte rechts */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f4,#0f1211);--card:light-dark(#fff,#181c1a);--ink:light-dark(#151a17,#e7ebe8);--muted:light-dark(#69726d,#959e99);--line:light-dark(#e1e5e2,#2a302d);--soft:light-dark(#eef1ef,#222825);--acc:light-dark(#5b7798,#8ea6c4);--pb:light-dark(#9aa19d,#6f7773);--ok:#1f9d55;--warn:#e0a100;--bad:#d23b2f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
.num,.time,.chip,h1{font-family:"Barlow Semi Condensed",Inter,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px max(4vw,14px)}
h1{margin:0;font-size:28px;line-height:1.05;font-weight:700}
h1 span{font-weight:500;font-size:16px;color:var(--muted);margin-left:8px}
form{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;margin-top:12px;max-width:760px}
.fields{display:grid;gap:6px}
input{width:100%;font:16px Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);min-height:44px}
input:focus-visible,button:focus-visible,article:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:600 15px Inter,sans-serif;border:0;border-radius:8px;min-height:44px;cursor:pointer}
.swap{background:var(--soft);color:var(--ink);font-size:20px;border:1px solid var(--line)}
.actions{grid-column:1/-1;display:flex;gap:8px}.actions button{flex:1 1 0;padding:0 10px}
.go{background:var(--ink);color:var(--card);padding:0 18px}
.ghostbtn{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:0 14px}
.status{font-size:13px;color:var(--muted);padding:8px max(4vw,14px);border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.status b{color:var(--ink);font-weight:600}
.demo{background:var(--soft);color:var(--muted);padding:8px max(4vw,14px);font-size:14px;display:none;border-bottom:1px solid var(--line)}
.demo.on{display:block}
#map{background:light-dark(#eceeed,#1b1f1d)}
#list{padding:12px max(4vw,14px) 40px;display:grid;gap:10px;align-content:start}
article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;position:relative}
article.sel{border-color:var(--acc);box-shadow:inset 4px 0 0 var(--acc)}
.r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.time{font-size:30px;font-weight:700;line-height:1}
.arrt{font-size:20px;font-weight:600;color:var(--muted)}
.late{font:700 16px "Barlow Semi Condensed",sans-serif;color:var(--ink)}
.pill{margin-left:auto;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;color:#fff;white-space:nowrap}
.pill.ok{background:var(--ok)}.pill.warn{background:var(--warn);color:#2a1f00}.pill.bad{background:var(--bad)}.pill.direct{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.tag{font-size:12px;font-weight:600;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);padding:1px 8px;border-radius:99px}
.legs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 2px;font-size:13px;color:var(--muted)}
.chip{background:var(--soft);color:var(--ink);font-weight:700;font-size:15px;padding:1px 8px;border-radius:5px;white-space:nowrap}
.xf{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:6px}
.xf i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line)}
.xf.ok i{background:var(--ok)}.xf.warn i{background:var(--warn)}.xf.bad i{background:var(--bad)}
.xf b{margin-left:auto;font-weight:600;white-space:nowrap}
.planb{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.planb h3{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--muted)}
.planb ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.planb li{display:flex;gap:8px;align-items:center;font-size:14px}
.planb .num{font-size:18px;font-weight:700;min-width:44px}
.empty,.note{color:var(--muted);font-size:14px}
/* Leaflet (nötiger Teil, inline) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;position:relative;outline:0;font:inherit;-webkit-tap-highlight-color:transparent}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-interactive{cursor:pointer}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-right .leaflet-control{float:right}
.leaflet-bar{margin:10px;border-radius:8px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.leaflet-bar a{display:block;width:36px;height:36px;line-height:36px;text-align:center;background:var(--card);color:var(--ink);text-decoration:none;font:600 20px/36px system-ui}
.leaflet-control-attribution{font-size:11px;background:rgba(255,255,255,.8);color:#333;padding:0 5px}
.leaflet-control-attribution a{color:#333}
.leaflet-tile-pane{filter:grayscale(1) brightness(1.06) contrast(.88)}
:root[data-theme=dark] .leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.85) contrast(.8)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.85) contrast(.8)}}
.vwrap{transition:transform 1s linear}
.leaflet-zoom-anim .vwrap{transition:none}
.veh{position:absolute;width:22px;height:22px;left:-11px;top:-11px;border-radius:50%;background:var(--c);display:grid;place-items:center;
  box-shadow:0 0 0 2px light-dark(#fff,#181c1a),0 0 12px 3px color-mix(in srgb,var(--c) 50%,transparent)}
.veh svg{width:13px;height:13px;fill:#fff}
.veh b{position:absolute;left:27px;top:50%;transform:translateY(-50%);font:700 13px "Barlow Semi Condensed",sans-serif;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px var(--card),0 0 3px var(--card),0 0 3px var(--card)}
.veh.wait{opacity:.5}
.veh.ghost{width:16px;height:16px;left:-8px;top:-8px;box-shadow:0 0 0 2px light-dark(#fff,#181c1a)}
.veh.ghost svg{width:10px;height:10px}.veh.ghost b{left:21px;font-weight:600;color:var(--muted)}
.slab{position:absolute;transform:translate(-50%,9px);font-weight:500!important;color:var(--muted)!important;font:600 12px Inter,sans-serif;color:light-dark(#0f1a13,#e6eee8);white-space:nowrap;text-shadow:0 0 3px light-dark(#fff,#000),0 0 3px light-dark(#fff,#000)}
@media(prefers-reduced-motion:reduce){.vwrap{transition:none}}
[hidden]{display:none!important}
.opt{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.opt select{font:15px Inter,sans-serif;min-height:40px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.wchip{display:inline-flex;align-items:center;gap:2px;font:600 14px "Barlow Semi Condensed",sans-serif;color:var(--muted);white-space:nowrap}
.wchip svg{width:15px;height:15px;fill:currentColor}
.walk{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--muted)}
.walk b{color:var(--ink);font-weight:600}
.walk .wt{margin-left:auto;white-space:nowrap}
.walk .wi{width:24px;height:24px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--muted) 60%,transparent);display:grid;place-items:center;flex:none}
.walk .wi svg{width:14px;height:14px;fill:var(--muted)}
.xbig small{display:block;font-size:13px;color:var(--muted)}
.sum{width:100%;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);color:var(--ink);padding:0 12px;text-align:left;font-weight:600}
.sum .edit{color:var(--muted);font-weight:500;font-size:14px;flex:none}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"focus" "map" "list";align-content:start}
#focus{grid-area:focus;padding:12px max(4vw,14px) 12px}
#focus:empty{display:none}
#map{grid-area:map;height:36vh;min-height:240px}
#list{grid-area:list}
@media(min-width:900px){body{height:100vh}main{grid-template-columns:minmax(0,470px) minmax(0,1fr);grid-template-areas:"focus map" "list map";grid-template-rows:auto minmax(0,1fr);min-height:0;align-content:stretch}#map{height:auto}#list{overflow:auto;max-height:none}}
h2{font-size:14px;font-weight:600;color:var(--muted);margin:2px 0 0}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.fhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.leg{margin-top:16px}
.lh{display:flex;align-items:center;gap:8px;font-size:14px}
.lh .ico{width:24px;height:24px;border-radius:50%;background:var(--acc);display:grid;place-items:center;flex:none}
.lh .ico svg{width:14px;height:14px;fill:#fff}
.lh .dir{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh{flex-wrap:wrap}.lh .ls{order:5;flex-basis:100%;margin:2px 0 0 32px;font-weight:600;font-size:15px}
.track{position:relative;height:30px;margin:8px 12px 0}
.rail{position:absolute;left:0;right:0;top:14px;height:2px;background:var(--line)}
.rail.ride{height:4px;top:13px;background:color-mix(in srgb,var(--acc) 50%,transparent);border-radius:2px}
.tick{position:absolute;top:10px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--card);border:2px solid color-mix(in srgb,var(--acc) 70%,transparent)}
.tick.pre{width:6px;height:6px;margin-left:-3px;top:12px;border:0;background:color-mix(in srgb,var(--muted) 45%,transparent)}
.tick.key{width:14px;height:14px;margin-left:-7px;top:8px;border:3px solid var(--ink)}
.track .dot{position:absolute;top:3px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--acc);display:grid;place-items:center;z-index:1;transition:left 1s linear;
  box-shadow:0 0 0 2px var(--card),0 0 12px 3px color-mix(in srgb,var(--acc) 50%,transparent)}
.track .dot svg{width:14px;height:14px;fill:#fff}
.track .dot.unk{opacity:.45}
.ends{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:2px}
.ends span:last-child{text-align:right}
.ends b{color:var(--ink);font-weight:600;white-space:nowrap}
.xbig{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 12px;border-radius:10px;font-size:15px;background:var(--soft);border-left:5px solid var(--line)}
.xbig b{margin-left:auto;white-space:nowrap;font:700 19px "Barlow Semi Condensed",sans-serif}
.xbig.ok{border-color:var(--ok)}.xbig.warn{border-color:var(--warn)}.xbig.bad{border-color:var(--bad)}.xbig.bad b{color:var(--bad)}
@media(prefers-reduced-motion:reduce){.track .dot{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Reicht's?<span>Basel · Tram &amp; Bus live</span></h1>
  <button type="button" id="sum" class="sum" hidden><span id="sumt"></span><span class="edit">Ändern</span></button>
  <form id="f">
    <div class="fields">
      <input id="from" list="stations" autocomplete="off" aria-label="Von" placeholder="Von (Haltestelle)">
      <input id="to" list="stations" autocomplete="off" aria-label="Nach" placeholder="Nach (Haltestelle)">
    </div>
    <button type="button" class="swap" id="swap" aria-label="Von und Nach tauschen">⇅</button>
    <label class="opt">Fussweg höchstens <select id="mw"><option value="3">3 Min.</option><option value="5" selected>5 Min.</option><option value="10">10 Min.</option><option value="99">egal</option></select></label>
    <div class="actions">
      <button class="go" type="submit">Ab jetzt suchen</button>
      <button type="button" class="ghostbtn" id="gps">Standort nutzen</button>
    </div>
    <datalist id="stations"></datalist>
  </form>
</header>
<div class="demo" id="demo">Demo-Daten – Fahrplan-API hier nicht erreichbar (in der Claude-Vorschau normal).</div>
<div class="status"><span id="st">Bereit</span><span>Positionen aus Fahrplan + Prognose</span></div>
<main>
  <section id="focus" aria-live="polite"></section>
  <div id="map" aria-label="Karte mit den Fahrzeugen der gewählten Verbindung"></div>
  <section id="list"><p class="empty">Von und Nach eingeben, dann «Ab jetzt suchen».</p></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
window.addEventListener('error',e=>{const s=document.getElementById('st');if(s)s.textContent='Fehler: '+(e.message||'Skript');});
window.addEventListener('unhandledrejection',e=>{const s=document.getElementById('st');if(s)s.textContent='Fehler: '+((e.reason&&e.reason.message)||e.reason);});
{
const API='https://transport.opendata.ch/v1/';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=s=>{if(!s)return null;const v=Date.parse(String(s).replace(/([+-]\d\d)(\d\d)$/,'$1:$2'));return isNaN(v)?null:v/1000};
const now=()=>Date.now()/1000;
const TZ={timeZone:'Europe/Zurich'};
const hhmm=d=>d.toLocaleTimeString('de-CH',{...TZ,hour:'2-digit',minute:'2-digit',hour12:false});
const hm=t=>t==null?'–':hhmm(new Date(t*1000));
const ymd=d=>new Intl.DateTimeFormat('sv-SE',{...TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const dep=p=>p?(T(p.prognosis&&p.prognosis.departure)??(p.departureTimestamp!=null?p.departureTimestamp+(p.delay||0)*60:null)):null;
const arr=p=>p?(T(p.prognosis&&p.prognosis.arrival)??(p.arrivalTimestamp!=null?p.arrivalTimestamp+(p.delay||0)*60:null)):null;
const stn=p=>p&&(p.station||p.location)||{};
const ll=p=>{const c=stn(p).coordinate||{};const a=+c.x,b=+c.y;return a&&b&&isFinite(a)&&isFinite(b)?[Math.max(a,b),Math.min(a,b)]:null};
const short=n=>String(n||'').replace(/^Basel,\s*/,'');
const vkey=r=>(r.journey.name||r.journey.number)+'@'+(r.departure&&r.departure.departureTimestamp);
const ckey=c=>(c.sections||[]).filter(s=>s.journey).map(vkey).join('|');
const lvl=b=>b==null?'direct':b<0?'bad':b<120?'warn':'ok';
const LV={ok:'Reicht',warn:'Knapp',bad:'Reicht nicht',direct:'Direkt'};
const LC={ok:'#1f9d55',warn:'#e0a100',bad:'#d23b2f',direct:'#69726d'};
const hav=(a,b)=>{const R=6371e3,r=Math.PI/180,dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;const h=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const bufTxt=b=>b==null?'?':b<0?`${Math.ceil(-b/60)} Min. zu spät`:b<60?'unter 1 Min. Puffer':`${Math.floor(b/60)} Min. Puffer`;
const dark=()=>{const t=document.documentElement.dataset.theme;return t==='dark'||(t!=='light'&&!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))};
const ACC=()=>dark()?'#8ea6c4':'#5b7798',PBC=()=>dark()?'#6f7773':'#9aa19d';
const ICON={T:'<svg viewBox="0 0 24 24"><path d="M9 0h6v2H9zM7 3h10a2 2 0 0 1 2 2v10a3 3 0 0 1-2 2.8l1.5 2.2H16l-1.3-2H9.3L8 20H5.5L7 17.8A3 3 0 0 1 5 15V5a2 2 0 0 1 2-2zm0 3v5h10V6zm1.5 7.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm7 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>',
  B:'<svg viewBox="0 0 24 24"><path d="M6 2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-1 1.7V20h-2.5v-2h-9v2H5v-2.3A2 2 0 0 1 4 16V4a2 2 0 0 1 2-2zm0 3v6h12V5zm1.5 8a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm9 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg>'};
const WALK='<svg viewBox="0 0 24 24"><circle cx="13.5" cy="3.8" r="2.1"/><path d="M10.2 7.2 6.5 9v4h2v-2.7l1.4-.6-2 9.8H10l1.3-5.6 2.2 2.1V21h2v-5.8l-2.3-2.2.7-3.2a6 6 0 0 0 4.1 2.2v-2a4 4 0 0 1-3.2-2l-1-1.6a2.2 2.2 0 0 0-2.8-.8z"/></svg>';
const mins=s=>Math.max(1,Math.round(s/60));
const icon=r=>/^(B|NFB|BUS|KB)$/i.test(r.journey.category||'')?ICON.B:ICON.T;
const st={tn:0,userMoved:0,routePts:[],walkFallback:false,raw:[],maxWalk:5,from:'',to:'',time:new Date(),conns:[],selKey:null,demo:false,live:false,updated:0,planB:null,me:null,
  prog:new Map(),fitKey:'',veh:[],band:[],busy:false,pending:false,appr:new Map(),orig:new Map()};

function walkSec(s){
  const a=s.departure&&s.departure.departureTimestamp,b=s.arrival&&s.arrival.arrivalTimestamp;
  if(a&&b&&b>a)return b-a;
  const d=s.walk&&s.walk.duration;if(d==null)return 120;
  if(typeof d==='number')return d>=60?d:d*60;
  const p=String(d).split(/[:d]/).map(Number).slice(-3);return (p[0]||0)*3600+(p[1]||0)*60+(p[2]||0);
}
function analyse(c){
  const rides=[],xfers=[],walks=[];let walk=0,last=null,valid=true,maxWalk=0,walkTotal=0;
  for(const s of c.sections||[]){
    if(s.journey){
      if(last){
        const a=arr(last.arrival),d=dep(s.departure);
        const pa=last.arrival&&last.arrival.arrivalTimestamp,pd=s.departure&&s.departure.departureTimestamp;
        if(pa&&pd&&pd+60<pa)valid=false;
        const same=stn(last.arrival).id&&stn(last.arrival).id===stn(s.departure).id;
        const need=walk||(same?60:180);
        xfers.push({at:stn(s.departure).name||'',atId:stn(s.departure).id,fromAt:stn(last.arrival).name||'',walk,from:last,to:s,arr:a,dep:d,need,buf:a!=null&&d!=null?d-a-need:null});
      }
      rides.push(s);last=s;walk=0;
    } else {const w=walkSec(s);walk+=w;walkTotal+=w;maxWalk=Math.max(maxWalk,w);walks.push(s)}
  }
  if(!rides.length)valid=false;
  let reach=null;
  if(st.me&&rides[0]){const p=ll(rides[0].departure),d=dep(rides[0].departure);if(p&&d){const m=hav(st.me,p)*1.3;reach={m,buf:d-now()-m/1.25}}}
  const bufs=xfers.map(x=>x.buf).filter(b=>b!=null);if(reach)bufs.push(reach.buf);
  const min=bufs.length?Math.min(...bufs):null;
  return {rides,xfers,walks,reach,min,level:lvl(min),valid,maxWalk,walkTotal};
}
function tidy(list,keep){
  const L=st.maxWalk*60,D=o=>dep(o.c.from)??0,A=o=>arr(o.c.to)??0;
  const all=list.map(c=>({c,a:analyse(c),k:ckey(c)})).filter(o=>o.a.valid||o.k===keep);
  let b=all.filter(o=>o.a.maxWalk<=L||o.k===keep);if(keep!==undefined)st.walkFallback=!b.length&&all.length>0;if(!b.length)b=all;
  const seen=new Set();b=b.filter(o=>!seen.has(o.k)&&seen.add(o.k));
  b=b.filter(o=>o.k===keep||!b.some(p=>p!==o&&D(p)>=D(o)&&A(p)<=A(o)&&(D(p)>D(o)||A(p)<A(o)||p.a.walkTotal<o.a.walkTotal)));
  b.sort((x,y)=>D(x)-D(y)||A(x)-A(y));
  return b.slice(0,6).map(o=>o.c);
}
function selIndex(){const i=st.conns.findIndex(c=>ckey(c)===st.selKey);return i<0?0:i}

async function getJSON(url){
  const ac=typeof AbortController!=='undefined'?new AbortController():null;
  const to=setTimeout(()=>ac&&ac.abort(),8000);
  try{const r=await fetch(url,ac?{signal:ac.signal}:{});if(!r.ok){const e=new Error('HTTP '+r.status);e.http=r.status;throw e}return await r.json()}
  finally{clearTimeout(to)}
}

async function load(fresh){
  if(st.busy){if(fresh)st.pending=true;return}
  st.busy=true;
  try{
    if(fresh){st.time=new Date();st.selKey=null;st.prog.clear();st.fitKey='';st.appr.clear();st.planB=null}
    setStatus('Lade …');
    if(!st.demo){
      const q=new URLSearchParams({from:st.from,to:st.to,limit:'10',date:ymd(st.time),time:hhmm(st.time)});
      try{const j=await getJSON(API+'connections?'+q);st.raw=j.connections||[];st.conns=tidy(st.raw,st.selKey);st.live=true;addTiles()}
      catch(e){
        if(e.http){setStatus(`Fehler ${e.http} – API nicht erreichbar oder Limit erreicht`);return}
        if(st.live){setStatus('Keine Verbindung zur API – zeige letzten Stand');return}
        st.demo=true;$('#demo').classList.add('on');
      }
    }
    if(st.demo){st.raw=demoConns();st.conns=st.raw}
    if(fresh&&st.conns.length)compact(true);
    if(!st.conns.some(c=>ckey(c)===st.selKey))st.selKey=st.conns[0]?ckey(st.conns[0]):null;
    st.updated=now();
    render();
    await Promise.all([loadPlanB(),loadApproaches()]);
    render();
  }finally{
    st.busy=false;
    if(st.pending){st.pending=false;load(true)}
  }
}

async function loadPlanB(){
  const c=st.conns[selIndex()];if(!c){st.planB=null;return}
  const x=analyse(c).xfers[0];if(!x||x.arr==null){st.planB=null;return}
  let list;
  if(st.demo)list=demoPlanB();
  else{
    const d=new Date(x.arr*1000);
    const q=new URLSearchParams({from:x.atId||x.at,to:st.to,limit:'8',date:ymd(d),time:hhmm(d)});
    try{list=tidy((await getJSON(API+'connections?'+q)).connections||[])}catch(e){return}
  }
  const orig=vkey(x.to);
  st.planB={x,list:list.map(k=>{const r=(k.sections||[]).find(s=>s.journey);if(!r)return null;
    const same=stn(r.departure).id===x.atId;const buf=dep(r.departure)-x.arr-(same?60:180);
    return {k,r,buf}}).filter(o=>o&&vkey(o.r)!==orig&&o.buf>=0).slice(0,3)};
}

/* Anfahrt: Haltestellen VOR dem Einstieg, über die Gegenrichtung an der Endhaltestelle */
async function loadApproaches(){
  if(st.demo)return;
  const c=st.conns[selIndex()];if(!c)return;
  await Promise.all((c.sections||[]).filter(s=>s.journey).map(r=>loadApproach(r).catch(()=>{})));
}
async function loadApproach(r){
  const d=dep(r.departure),dp=r.departure&&r.departure.departureTimestamp;if(!d||!dp)return;
  if(d<now()-60||d-now()>50*60)return;
  const j=r.journey,bName=stn(r.departure).name,bId=String(stn(r.departure).id||'');
  const same=e=>String(e.number)===String(j.number)&&e.category===j.category;
  const hasB=pl=>(pl||[]).findIndex(p=>String(stn(p).id)===bId);
  /* 1) Startpunkt: an der Zielhaltestelle das Fahrzeug derselben Linie suchen, das in Gegenrichtung DURCH deine Haltestelle fährt */
  const okey=j.category+j.number+'>'+j.to+'@'+bId;
  let o=st.orig.get(okey);
  if(o===undefined){
    o=null;
    try{
      const f=['number','category','to','passList/station/id','passList/departureTimestamp','passList/arrivalTimestamp'].map(x=>'&fields[]=stationboard/'+x).join('');
      const sb=await getJSON(API+'stationboard?'+new URLSearchParams({station:j.to,limit:'30'})+f);
      const m=(sb.stationboard||[]).find(e=>same(e)&&hasB(e.passList)>=0);
      if(m){const pl=m.passList,i=hasB(pl),last=pl[pl.length-1];
        const travel=(last.arrivalTimestamp&&pl[i].departureTimestamp)?last.arrivalTimestamp-pl[i].departureTimestamp:30*60;
        o={origin:m.to,travel:Math.max(0,travel)}}
    }catch(e){}
    st.orig.set(okey,o);
  }
  if(!o||!o.origin||o.origin===bName)return;
  /* 2) Abfahrtstafel am Startpunkt: dieselbe Fahrt (gleicher Name) mit allen Haltestellen + Prognosen */
  const t0=new Date((dp-o.travel-12*60)*1000);
  try{
    const sb=await getJSON(API+'stationboard?'+new URLSearchParams({station:o.origin,limit:'25',datetime:ymd(t0)+' '+hhmm(t0)})+'&fields[]=stationboard/name&fields[]=stationboard/number&fields[]=stationboard/category&fields[]=stationboard/passList');
    const m=(sb.stationboard||[]).find(e=>same(e)&&e.name===j.name);
    if(m){const i=hasB(m.passList);if(i>0){st.appr.set(vkey(r),m.passList.slice(0,i+1));return}}
  }catch(e){}
  /* 3) Rückfall: Verbindungssuche Startpunkt → deine Haltestelle mit Ankunftszeit */
  const q=new URLSearchParams({from:o.origin,to:bId||bName,limit:'8',isArrivalTime:'1',date:ymd(new Date(dp*1000)),time:hhmm(new Date((dp+120)*1000))});
  const res=await getJSON(API+'connections?'+q);
  for(const k of res.connections||[])for(const s of k.sections||[]){
    if(s.journey&&s.journey.name===j.name&&String(s.journey.number)===String(j.number)){
      const pl=s.journey.passList||[],i=hasB(pl);
      if(i>0){st.appr.set(vkey(r),pl.slice(0,i+1));return}
    }
  }
}

/* Haltestellenliste eines Fahrzeugs: Anfahrt + eigene Strecke; b = Index deines Einstiegs */
function listFor(r){
  const a=st.appr.get(vkey(r))||[];
  const pl=[...a.slice(0,-1),r.departure,...(r.journey.passList||[]).slice(1,-1),r.arrival].filter(p=>ll(p));
  return {pl,b:Math.max(0,pl.indexOf(r.departure))};
}
function pos(r){
  const {pl,b}=listFor(r),n=pl.length-1;if(n<1)return null;
  const t=now(),tA=i=>arr(pl[i])??dep(pl[i]),tD=i=>dep(pl[i])??arr(pl[i]);
  const tb=dep(r.departure),waitMin=tb!=null&&t<tb?Math.max(0,Math.ceil((tb-t)/60)):null;
  let prog=n;
  if(tD(0)!=null&&t<tD(0))prog=0;
  else if(!(tA(n)!=null&&t>=tA(n)))for(let i=0;i<n;i++){
    if(t<tD(i)){prog=i;break}
    if(t<tA(i+1)){prog=i+(t-tD(i))/Math.max(1,tA(i+1)-tD(i));break}
  }
  const key=vkey(r),old=st.prog.get(key);if(old!=null&&prog<old&&old-prog<1.5)prog=old;st.prog.set(key,prog);
  const i=Math.min(Math.floor(prog),n-1),f=Math.min(1,prog-i),A=ll(pl[i]),B=ll(pl[i+1]);
  return{p:[A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f],prog,b,n,pl,waitMin,done:tA(n)!=null&&t>=tA(n)+60};
}

function render(){
  const A=st.conns.map(analyse),si=selIndex();
  const best=A[0]&&A[0].level==='bad'?A.findIndex(a=>a.level!=='bad'):-1;
  $('#list').innerHTML=st.conns.length?(st.walkFallback?`<p class="note">Keine Verbindung mit höchstens ${st.maxWalk} Min. Fussweg gefunden – zeige alle.</p>`:'')+'<h2>Verbindungen · antippen zum Anzeigen</h2>'+st.conns.map((c,i)=>card(c,A[i],i===si,i===best)).join('')
    :'<p class="empty">Keine Verbindung gefunden. Haltestellennamen prüfen (z.B. «Basel, Barfüsserplatz»).</p>';

}
function head(c,a){

  const late=d0p&&d0-d0p>=60?`<span class="late">+${Math.round((d0-d0p)/60)}</span>`:'';
  return `<span class="time">${hm(d0)}</span>${late}<span class="arrt">→ ${hm(a1)}</span>`;
}
function card(c,a,sel,best){
  const chips=(c.sections||[]).map(s=>s.journey?`<span class="chip" title="Richtung ${esc(s.journey.to)}">${esc(s.journey.category)} ${esc(s.journey.number||'')}</span>`
    :`<span class="wchip">${WALK}${mins(walkSec(s))}'</span>`).join('<span>›</span>');
  const xf=a.xfers.map(x=>`<div class="xf ${lvl(x.buf)}"><i></i><span>Umstieg ${esc(short(x.at))}${x.walk?` · ${mins(x.walk)}' zu Fuss`:''}</span><b>${bufTxt(x.buf)}</b></div>`).join('');
  return `<article tabindex="0" class="${sel?'sel':''}" data-k="${esc(ckey(c))}">
  <div class="r1">${head(c,a)}${best?'<span class="tag">Empfohlen</span>':''}<span class="pill ${a.level}">${LV[a.level]}</span></div>
  <div class="legs">${chips}<span>ab ${esc(short(stn(c.from).name))}</span></div>${xf}</article>`;
}
const xbig=(t,b)=>`<div class="xbig ${lvl(b)}"><span>${t}</span><b>${bufTxt(b)}</b></div>`;
function renderFocus(c,a){

      `<li><span class="num">${hm(dep(o.r.departure))}</span><span class="chip">${esc(o.r.journey.category)} ${esc(o.r.journey.number||'')}</span><span>an ${hm(arr(o.k.to))}</span></li>`).join('')+'</ul>':'<p class="note">Keine erreichbare Alternative gefunden.</p>')+'</div>';

const xpos=(i,b,n)=>{const A=b>0?30:0;return b>0&&i<=b?A*i/b:A+(100-A)*(i-b)/Math.max(1,n-b)};
function drawTrack(o,P){
  const{b,n}=P;let h=`<div class="rail"></div><div class="rail ride" style="left:${xpos(b,b,n)}%"></div>`;
  for(let i=0;i<=n;i++)h+=`<i class="${i===b||i===n?'tick key':i<b?'tick pre':'tick'}" style="left:${xpos(i,b,n)}%"></i>`;
  o.track.innerHTML=h+`<div class="dot">${icon(o.r)}</div>`;o.dot=o.track.querySelector('.dot');

function legStatus(P){

  if(P.prog<P.b)return`noch ${pl(P.b-Math.floor(P.prog))} bis zu dir · ${P.waitMin??0}'`;
  if(P.waitMin!=null)return P.b>0?`steht an deiner Haltestelle · ${P.waitMin}'`:`fährt in ${P.waitMin}'`;
  return`unterwegs · noch ${pl(P.n-Math.floor(P.prog))}`;
}

const label=(p,txt)=>L.marker(p,{interactive:false,keyboard:false,icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="slab">${esc(txt)}</div>`})}).addTo(layer);
function drawMap(a){
  st.veh=[];if(!map)return;

    if(!it.ghost)own.forEach((p,j)=>L.circleMarker(p,{radius:j===0||j===own.length-1?4:2.5,color:dark()?'#5d6561':'#b4bbb7',weight:1.5,fillColor:'#fff',fillOpacity:1,interactive:false}).addTo(layer));

  }

  if(a.walks.length&&a.walks[0]===(st.conns[selIndex()].sections||[])[0]&&ll(a.walks[0].departure))label(ll(a.walks[0].departure),short(stn(a.walks[0].departure).name));

  if(lastR&&ll(lastR.arrival))label(ll(lastR.arrival),short(stn(lastR.arrival).name));
  if(st.me)L.circleMarker(st.me,{radius:7,color:'#fff',weight:3,fillColor:'#1e5bd6',fillOpacity:1,interactive:false}).addTo(layer);

  if(pts.length&&st.fitKey!==fk){map.fitBounds(pts,{padding:[36,36],maxZoom:16});st.fitKey=fk}
  tick();
}

function tick(){
  for(const v of st.veh){
    const el=v.m.getElement();if(!el)continue;const box=el.firstChild,P=pos(v.r);
    if(!P||P.done){el.style.display='none';continue}
    el.style.display='';v.m.setLatLng(P.p);v.lastP=P.p;
    const b=box.querySelector('b'),txt=v.label+(P.waitMin!=null?` · ${P.waitMin}'`:'');
    if(b&&b.textContent!==txt)b.textContent=txt;
    box.classList.toggle('wait',P.b===0&&P.waitMin!=null);
  }
  if(map&&++st.tn%3===0&&now()-st.userMoved>25){
    const vis=st.veh.filter(v=>!v.ghost&&v.lastP&&v.m.getElement()&&v.m.getElement().style.display!=='none');
    const bb=map.getBounds().pad(-0.08);
    if(vis.some(v=>!bb.contains(v.lastP))){st.autoFit=true;map.fitBounds([...(st.routePts||[]),...vis.map(v=>v.lastP)],{padding:[36,36],maxZoom:16,animate:true})}
  }
  for(const o of st.band){
    const P=pos(o.r);if(!P)continue;
    const sig=P.n+'|'+P.b;if(o.sig!==sig){drawTrack(o,P);o.sig=sig}
    o.dot.style.left=xpos(P.prog,P.b,P.n)+'%';
    o.dot.classList.toggle('unk',P.b===0&&P.waitMin!=null);
    const s=legStatus(P);if(o.ls.textContent!==s)o.ls.textContent=s;
  }
  if(st.updated&&!st.busy)setStatus(st.demo?'<b>Demo</b> · Fahrzeuge bewegen sich in Echtzeit':`<b>Live</b> · aktualisiert vor ${Math.round(now()-st.updated)} s`);
}

/* Demo-Daten im Format von transport.opendata.ch, Zeiten relativ zu jetzt */
const S={NEU:['Basel, Neuweilerstrasse','8589110',47.5555,7.5655],ALL:['Basel, Allschwilerplatz','8589293',47.557241,7.570579],BRA:['Basel, Brausebad','8581062',47.555537,7.575861],SCH:['Basel, Schützenhaus','8589360',47.553203,7.577092],ZOO:['Basel, Zoo Bachletten','8589381',47.550881,7.580451],HEU:['Basel, Heuwaage','8500079',47.551269,7.588051],THE:['Basel, Theater','8500994',47.553124,7.589776],BAR:['Basel, Barfüsserplatz','8500897',47.554591,7.589057],BAN:['Basel, Bankverein','8500896',47.55365,7.59245],KUN:['Basel, Kunstmuseum','8500893',47.5547,7.5944],WET:['Basel, Wettsteinplatz','8500898',47.5596,7.5961]};
const T0=Math.floor(now()/60)*60;

function dpass(k,m,d){const[name,id,x,y]=S[k],ts=T0+m*60;return{station:{id,name,coordinate:{type:'WGS84',x,y}},arrivalTimestamp:ts,departureTimestamp:ts,delay:d,prognosis:{arrival:iso(ts+d*60),departure:iso(ts+d*60)}}}
function dride(cat,num,to,stops,d){const pl=stops.map(([k,m])=>dpass(k,m,d));return{journey:{name:cat+num+'-'+stops[0][1],category:cat,number:num,to,passList:pl},departure:pl[0],arrival:pl[pl.length-1]}}
function dconn(...rides){return{from:rides[0].departure,to:rides[rides.length-1].arrival,sections:rides}}
const six=(o,d)=>dride('T','6','Riehen Grenze',[['ALL',o-4],['BRA',o-2],['SCH',o-1],['ZOO',o+1],['HEU',o+3],['THE',o+4],['BAR',o+5]],d);
const two=(o,d)=>dride('T','2','Eglisee',[['BAR',o],['BAN',o+1],['KUN',o+2],['WET',o+5]],d);
function demoConns(){
  const c=[dconn(six(0,3),two(8,0)),dconn(six(8,0),two(18,1)),dconn(six(15,1),two(25,0))];
  /* Demo-Anfahrt: 2er kommt vom Theater her, 6er der zweiten Verbindung von der Neuweilerstrasse */
  st.appr.set(vkey(c[0].sections[1]),[dpass('HEU',3,0),dpass('THE',5,0),dpass('BAR',8,0)]);
  st.appr.set(vkey(c[1].sections[0]),[dpass('NEU',-2,0),dpass('ALL',4,0)]);
  return c;
}
function demoPlanB(){return[dconn(two(15,0)),dconn(two(22,1))]}

/* Bedienung */
const F=$('#from'),To=$('#to');
function compact(on){$('#f').hidden=on;$('#sum').hidden=!on;$('#sumt').textContent=short(st.from)+' → '+short(st.to)}
try{F.value=localStorage.getItem('rb-from')||'Basel, Allschwilerplatz';To.value=localStorage.getItem('rb-to')||'Basel, Wettsteinplatz'}catch(e){F.value='Basel, Allschwilerplatz';To.value='Basel, Wettsteinplatz'}
$('#f').addEventListener('submit',e=>{e.preventDefault();st.from=F.value.trim();st.to=To.value.trim();if(!st.from||!st.to)return;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  try{localStorage.setItem('rb-from',st.from);localStorage.setItem('rb-to',st.to)}catch(_){}load(true)});
$('#sum').addEventListener('click',()=>{compact(false);F.focus()});
const MW=$('#mw');
try{const v=localStorage.getItem('rb-mw');if(v){MW.value=v}}catch(e){}
st.maxWalk=+MW.value||5;
MW.addEventListener('change',()=>{st.maxWalk=+MW.value||5;try{localStorage.setItem('rb-mw',MW.value)}catch(e){}
  if(st.raw.length&&!st.demo){st.conns=tidy(st.raw,null);st.selKey=st.conns[0]?ckey(st.conns[0]):null;st.fitKey='';st.planB=null;
    render();Promise.all([loadPlanB(),loadApproaches()]).then(render)}});
$('#swap').addEventListener('click',()=>{const v=F.value;F.value=To.value;To.value=v});
let acT;
const ac=e=>{const v=e.target.value.trim();clearTimeout(acT);if(st.demo||v.length<2)return;
  acT=setTimeout(async()=>{try{const j=await getJSON(API+'locations?type=station&query='+encodeURIComponent(v));
    $('#stations').innerHTML=(j.stations||[]).filter(s=>s.id&&s.name).slice(0,8).map(s=>`<option value="${esc(s.name)}"></option>`).join('')}catch(_){}},250)};
F.addEventListener('input',ac);To.addEventListener('input',ac);
const pick=el=>{const a=el.closest('article');if(!a||a.dataset.k===st.selKey)return;st.selKey=a.dataset.k;st.planB=null;render();
  window.scrollTo({top:0,behavior:'smooth'});Promise.all([loadPlanB(),loadApproaches()]).then(render)};
$('#list').addEventListener('click',e=>pick(e.target));
$('#list').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e.target)}});
$('#gps').addEventListener('click',()=>{
  const b=$('#gps');
  if(!navigator.geolocation){b.textContent='Standort nicht verfügbar';return}
  try{navigator.geolocation.watchPosition(p=>{st.me=[p.coords.latitude,p.coords.longitude];b.textContent='Standort aktiv';if(st.conns.length)render()},
    ()=>{b.textContent='Standort gesperrt'},{enableHighAccuracy:true,maximumAge:10000})}catch(e){b.textContent='Standort gesperrt'}
});
setInterval(tick,1000);
setInterval(()=>{if(!document.hidden&&st.conns.length&&!st.demo)load(false)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st.conns.length&&!st.demo&&now()-st.updated>20)load(false)});
st.from=F.value.trim();st.to=To.value.trim();load(true);
}
</script>
</body>
</html>
