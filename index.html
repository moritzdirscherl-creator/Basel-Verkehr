<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Längt's? Basel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhiges Werkzeug für unterwegs, in einer Sekunde lesbar
   IDEA: Abfahrtsanzeiger – neutrale Fläche, grosse Zeiten; Farbe nur dort, wo sie etwas bedeutet
   PICTURE: die Karte mit den Fahrzeugen der gewählten Verbindung, die auf den Umsteigepunkt zufahren
   COLOUR+TYPE: neutral (Weiss/Grau); gedämpftes Schieferblau = deine Verbindung, Grau = Plan B; Grün/Gelb/Rot ausschliesslich für die Ampel
   LAYOUT: Telefon: Suche, Karte, Verbindungen gestapelt; breit: Liste links, Karte rechts */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f4,#0f1211);--card:light-dark(#fff,#181c1a);--ink:light-dark(#151a17,#e7ebe8);--muted:light-dark(#69726d,#959e99);--line:light-dark(#e1e5e2,#2a302d);--soft:light-dark(#eef1ef,#222825);--acc:light-dark(#5b7798,#8ea6c4);--pb:light-dark(#9aa19d,#6f7773);--ok:#1f9d55;--warn:#e0a100;--bad:#d23b2f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
.num,.time,.chip,h1{font-family:"Barlow Semi Condensed",Inter,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px max(4vw,14px)}
h1{margin:0;font-size:26px;line-height:1.05;font-weight:700}
h1 span{font-weight:500;font-size:16px;color:var(--muted);margin-left:8px}
form{display:grid;gap:6px;margin-top:10px;max-width:760px}
.fl{font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips:empty{display:none}
.chips::-webkit-scrollbar{display:none}
.chip2{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.chip2 small{color:var(--muted);font-size:12px}
.chip2.loc{border-color:var(--acc);color:var(--acc);font-weight:600}
.chip2.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip2.on small{color:inherit;opacity:.7}
.routes .chip2{background:var(--soft)}
.manage{display:flex;gap:8px;justify-content:flex-end}
.manage button{min-height:34px;padding:0 10px;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline}
.manage #clearBtn{color:var(--bad)}
.chip2 .x{display:none;margin-left:2px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font:700 13px/20px Inter,sans-serif;text-align:center}
form.editing .chip2[data-del] .x{display:inline-block}
form.editing .chip2[data-del]{border-color:var(--bad)}
input{width:100%;font:16px Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);min-height:44px}
input:focus-visible,button:focus-visible,article:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:600 15px Inter,sans-serif;border:0;border-radius:8px;min-height:44px;cursor:pointer}
.swap{background:var(--soft);color:var(--ink);font-size:20px;border:1px solid var(--line);min-height:44px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}.actions .go{flex:1 1 200px;min-height:48px;font-size:16px}
.go{background:var(--ink);color:var(--card);padding:0 18px}
.ghostbtn{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:0 14px}
.top{display:flex;align-items:baseline;gap:10px}.status{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.status b{color:var(--ink);font-weight:600}
.demo{background:var(--soft);color:var(--muted);padding:8px max(4vw,14px);font-size:14px;display:none;border-bottom:1px solid var(--line)}
.demo.on{display:block}
#map{background:light-dark(#eceeed,#1b1f1d)}
#list{padding:12px max(4vw,14px) 40px;display:grid;gap:10px;align-content:start}
article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;position:relative}
article.sel{border-color:var(--acc);box-shadow:inset 4px 0 0 var(--acc)}
.r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.time{font-size:30px;font-weight:700;line-height:1}
.arrt{font-size:20px;font-weight:600;color:var(--muted)}
.mu{color:var(--muted)}
.in{font-size:13px;color:var(--muted);font-weight:600}
.late{font:700 16px "Barlow Semi Condensed",sans-serif;color:var(--ink)}
.pill{margin-left:auto;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;color:#fff;white-space:nowrap}
.pill.ok{background:var(--ok)}.pill.warn{background:var(--warn);color:#2a1f00}.pill.bad{background:var(--bad)}.pill.direct{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.tag{font-size:12px;font-weight:600;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);padding:1px 8px;border-radius:99px}
.legs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 2px;font-size:13px;color:var(--muted)}
.chip{background:var(--soft);color:var(--ink);font-weight:700;font-size:15px;padding:1px 8px;border-radius:5px;white-space:nowrap}
.xf{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:6px}
.xf i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line)}
.xf.ok i{background:var(--ok)}.xf.warn i{background:var(--warn)}.xf.bad i{background:var(--bad)}
.xf b{margin-left:auto;font-weight:600;white-space:nowrap}
.planb{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.planb h3{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--muted)}
.planb ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.planb li{display:flex;gap:8px;align-items:center;font-size:14px}
.planb .num{font-size:18px;font-weight:700;min-width:44px}
.empty,.note{color:var(--muted);font-size:14px}
/* Leaflet (nötiger Teil, inline) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;position:relative;outline:0;font:inherit;-webkit-tap-highlight-color:transparent}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-interactive{cursor:pointer}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-right .leaflet-control{float:right}
.leaflet-bar{margin:10px;border-radius:8px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.leaflet-bar a{display:block;width:36px;height:36px;line-height:36px;text-align:center;background:var(--card);color:var(--ink);text-decoration:none;font:600 20px/36px system-ui}
.leaflet-control-attribution{font-size:11px;background:rgba(255,255,255,.8);color:#333;padding:0 5px}
.leaflet-control-attribution a{color:#333}
.leaflet-tile-pane{filter:grayscale(1) brightness(1.06) contrast(.88)}
:root[data-theme=dark] .leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.85) contrast(.8)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(.85) contrast(.8)}}
.vwrap{transition:transform 1s linear}
.leaflet-zoom-anim .vwrap{transition:none}
.veh{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;white-space:nowrap}
.veh .ln{box-shadow:0 0 0 2px light-dark(#fff,#181c1a),0 0 14px 4px color-mix(in srgb,var(--acc) 55%,transparent)}
.veh i{font:700 13px "Barlow Semi Condensed",sans-serif;font-style:normal;color:var(--ink);text-shadow:0 0 3px var(--card),0 0 3px var(--card),0 0 3px var(--card);position:absolute;left:100%;margin-left:5px}
.veh.wait .ln{opacity:.5}
.veh.ghost .ln{background:var(--pb);min-width:24px;height:20px;font-size:13px;box-shadow:0 0 0 2px light-dark(#fff,#181c1a)}
.veh.ghost i{color:var(--muted);font-weight:600}
.slab{position:absolute;transform:translate(-50%,9px);font-weight:500!important;color:var(--muted)!important;font:600 12px Inter,sans-serif;color:light-dark(#0f1a13,#e6eee8);white-space:nowrap;text-shadow:0 0 3px light-dark(#fff,#000),0 0 3px light-dark(#fff,#000)}
@media(prefers-reduced-motion:reduce){.vwrap{transition:none}}
[hidden]{display:none!important}
.opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.opt select{font:15px Inter,sans-serif;min-height:40px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.wchip{display:inline-flex;align-items:center;gap:2px;font:600 14px "Barlow Semi Condensed",sans-serif;color:var(--muted);white-space:nowrap}
.wchip svg{width:15px;height:15px;fill:currentColor}
.walk{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--muted)}
.walk b{color:var(--ink);font-weight:600}
.walk .wt{margin-left:auto;white-space:nowrap}
.walk .wi{width:24px;height:24px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--muted) 60%,transparent);display:grid;place-items:center;flex:none}
.walk .wi svg{width:14px;height:14px;fill:var(--muted)}
.xbig small{display:block;font-size:13px;color:var(--muted)}
.sum{width:100%;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);color:var(--ink);padding:0 12px;text-align:left;font-weight:600}
.sum .edit{color:var(--muted);font-weight:500;font-size:14px;flex:none}
/* Layout: Telefon = Antwort, Umschalter, Plan ODER Karte; breit = links Spalte, rechts Karte */
main{flex:1;display:flex;flex-direction:column}
#side{display:contents}
#hero{order:1;padding:12px max(4vw,14px) 0;position:relative}
.seg{order:2;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:4px;margin:12px max(4vw,14px) 0;padding:4px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.seg button{min-height:42px;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:15px;position:relative}
.seg button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .badge{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:1px}
.seg .badge.bad{background:var(--bad)}
#map{order:3;height:calc(100dvh - 330px);min-height:320px;margin-top:12px;border-block:1px solid var(--line)}
#focus{order:4;padding:12px max(4vw,14px) 16px}
#alts{order:5;padding:12px max(4vw,14px) 0}
#list{order:6}
main.v-plan #map,main.v-plan #alts,main.v-plan #list{display:none}
main.v-map #focus,main.v-map #alts,main.v-map #list{display:none}
main.v-alt #map,main.v-alt #focus,main.v-alt #list{display:none}
#hero:empty,#focus:empty,#alts:empty{display:none}
@media(min-width:900px){
  body{height:100vh}
  main{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);min-height:0}
  #side{display:block;overflow:auto;border-right:1px solid var(--line)}
  .seg{grid-template-columns:1fr 1fr}.seg .mapbtn{display:none}
  main #map{display:block!important;height:auto;margin:0;border:0}
}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:4px 0 0;text-transform:none}
/* Antwort-Kopf: Abfahrt (Längt / Renn! / Längt nid) und Umstieg getrennt */
.hero{--lc:var(--muted);--lt:var(--ink);border-radius:16px;padding:12px 16px;background:color-mix(in srgb,var(--lc) 13%,var(--card));border:1px solid color-mix(in srgb,var(--lc) 45%,transparent)}
.ok{--lc:var(--ok);--lt:light-dark(#137a40,#4fd08a)}
.renn,.warn{--lc:var(--warn);--lt:light-dark(#8a6200,#ffc94d)}
.bad{--lc:var(--bad);--lt:light-dark(#b0271d,#ff7a6e)}
.ride0{--lc:var(--acc);--lt:var(--ink)}
.hl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.dep{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.dep .w{font:700 40px/1 "Barlow Semi Condensed",sans-serif;color:var(--lt)}
.dep .w{min-width:0;flex:1}.dep .cd{flex:none}.dep .w.sm{font-size:22px;line-height:1.15;color:var(--ink)}
.dep .cd{text-align:right;font:700 30px/1 "Barlow Semi Condensed",sans-serif;white-space:nowrap}
.dep .cd small{display:block;font:500 12px Inter,sans-serif;color:var(--muted);margin-top:2px}
.dsub{font-size:14px;margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dsub .mu{color:var(--muted)}
.xr{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--card);border-left:5px solid var(--lc)}
.xr .xw{font:700 20px/1 "Barlow Semi Condensed",sans-serif;color:var(--lt);white-space:nowrap}
.xr .xt{font-size:14px;min-width:0}
.xr .xt .hl{display:block}
.alt{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--card);font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alt b{font:700 18px "Barlow Semi Condensed",sans-serif}
.alt button{margin-left:auto;min-height:36px;padding:0 12px;background:var(--ink);color:var(--card);font-size:14px}
.tip{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px;border-radius:10px;background:var(--card);font-size:13px;flex-wrap:wrap}
.tip>svg{width:16px;height:16px;fill:var(--muted);flex:none}
.tip .ln{min-width:24px;height:20px;font-size:13px;background:var(--pb)}
.tip button{margin-left:auto;min-height:32px;padding:0 10px;border-radius:8px;background:var(--soft);border:1px solid var(--line);color:var(--ink);font-size:13px}
.arrrow{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--muted)}
.arrrow b{color:var(--ink);font:700 18px "Barlow Semi Condensed",sans-serif}
#hero.blink::after{content:"";position:absolute;inset:12px max(4vw,14px) 0;border-radius:16px;background:var(--warn);pointer-events:none;opacity:0;animation:blink .55s ease-in-out 7}
@keyframes blink{50%{opacity:.6}}
@media(prefers-reduced-motion:reduce){#hero.blink::after{animation:none}}
/* Linien-Marke: dieselbe auf Karte, Band und Schritten */
.ln{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 7px;border-radius:7px;background:var(--acc);color:#fff;font:700 16px/1 "Barlow Semi Condensed",sans-serif;white-space:nowrap}
.ln.bus{border-radius:13px}
/* Schritte */
.steps{list-style:none;margin:0;padding:0}
.step{position:relative;padding:12px 0 12px 40px}
.step::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:2px;background:var(--line)}
.step:first-child::before{top:22px}.step:last-child::before{bottom:calc(100% - 22px)}
.step .mk{position:absolute;left:3px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center}
.step .mk svg{width:14px;height:14px;fill:var(--muted)}
.step.ride .mk{background:var(--acc);border-color:var(--acc)}
.step.ride .mk svg{fill:#fff}
.step.end .mk{border:4px solid var(--ink)}
.s1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.s1 .dir{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 0}
.s1 .tm{margin-left:auto;font:700 18px "Barlow Semi Condensed",sans-serif;white-space:nowrap}
.now{margin-top:6px;font-size:15px;font-weight:600}
.now em{font-style:normal;color:var(--muted);font-weight:500}
.track{position:relative;height:30px;margin:8px 16px 0 14px}
.rail{position:absolute;left:0;right:0;top:14px;height:2px;background:var(--line)}
.rail.ride{height:4px;top:13px;background:color-mix(in srgb,var(--acc) 55%,transparent);border-radius:2px}
.tick{position:absolute;top:10px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--card);border:2px solid color-mix(in srgb,var(--acc) 70%,transparent)}
.tick.pre{width:6px;height:6px;margin-left:-3px;top:12px;border:0;background:color-mix(in srgb,var(--muted) 45%,transparent)}
.tick.key{width:14px;height:14px;margin-left:-7px;top:8px;border:3px solid var(--ink)}
.track .dot{position:absolute;top:2px;margin-left:-15px;z-index:1;transition:left 1s linear;box-shadow:0 0 0 2px var(--card),0 0 12px 3px color-mix(in srgb,var(--acc) 50%,transparent)}
.track .dot.unk{opacity:.45}
.ends{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:2px}
.ends span:last-child{text-align:right}
.ends b{color:var(--ink);font-weight:600;white-space:nowrap}
.xstep .mk{border-color:var(--lc,var(--line))}
.xbox{--lc:var(--line);display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:15px;background:color-mix(in srgb,var(--lc) 12%,var(--card));border:1px solid color-mix(in srgb,var(--lc) 50%,transparent)}
.xbox.ok{--lc:var(--ok)}.xbox.warn{--lc:var(--warn)}.xbox.bad{--lc:var(--bad)}
.xbox b{margin-left:auto;white-space:nowrap;font:700 19px "Barlow Semi Condensed",sans-serif}
.xbox.bad b{color:var(--bad)}
.xbox small{display:block;font-size:13px;color:var(--muted)}
details.planb{margin:4px 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px}
details.planb summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;font-size:14px;list-style:none}
details.planb summary::after{content:"›";margin-left:auto;font-size:20px;color:var(--muted);transition:transform .2s}
details.planb[open] summary::after{transform:rotate(90deg)}
details.planb ul{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
details.planb li{display:flex;gap:8px;align-items:center;font-size:14px}
details.planb .ln{background:var(--pb)}
.pbh{font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 6px}
details.planb li{flex-wrap:wrap}
.pbgo{margin-left:auto;min-height:34px;padding:0 10px;border-radius:8px;background:var(--soft);border:1px solid var(--line);color:var(--ink);font-size:13px}
.foot{font-size:12px;color:var(--muted);margin:6px 0 0}
@media(prefers-reduced-motion:reduce){.track .dot{transition:none}}
/* Plan als Kacheln */
.tiles{display:flex;flex-direction:column}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.th,.tile.walk,.tile.xfer,.tile.end{display:flex;align-items:center;gap:12px}
.tb{min-width:0;flex:1}
.tt{font:700 21px/1.15 "Barlow Semi Condensed",sans-serif;overflow-wrap:anywhere}
.ts{font-size:13px;color:var(--muted);margin-top:2px}
.tr{margin-left:auto;text-align:right;font:700 26px/1 "Barlow Semi Condensed",sans-serif;white-space:nowrap}
.tr small{display:block;font:500 12px Inter,sans-serif;color:var(--muted);margin-top:4px}
.ln.big{min-width:48px;height:42px;font-size:25px;border-radius:11px;flex:none}
.ln.big.bus{border-radius:21px}
.tic{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.tic svg{width:22px;height:22px;fill:var(--muted)}
.tile.walk{background:var(--soft);border-style:dashed;box-shadow:none}
.tile.walk .tt{font-size:19px}
.tile.xfer{background:color-mix(in srgb,var(--lc) 14%,var(--card));border:2px solid color-mix(in srgb,var(--lc) 60%,transparent)}
.tile.xfer .tr{color:var(--lt)}
.tile.xfer .tr small{color:var(--ink);font-weight:600;font-size:13px}
.tile.end{border:2px solid var(--ink)}
.tile.end .tic{background:var(--ink)}.tile.end .tic::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--card)}
.tile .now{margin-top:10px;font-size:15px}
.tile .track{margin:8px 16px 0}
.tarrow{align-self:flex-start;margin:0 0 0 34px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:9px solid var(--line);margin-block:3px}
/* Alternativen */
.altsec{margin-bottom:14px}
.altsec h3{font-size:14px;font-weight:600;margin:0 0 8px}
.altsec h3 small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.atile{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;flex-wrap:wrap}
.atile .num{font:700 22px "Barlow Semi Condensed",sans-serif;min-width:52px}
.atile .lns{display:flex;gap:4px;align-items:center}
.atile .lns .ln{background:var(--pb)}
.atile .ar{margin-left:auto;text-align:right;font-size:13px;color:var(--muted)}
.atile .ar b{display:block;font:700 18px "Barlow Semi Condensed",sans-serif;color:var(--ink)}
.atile.walky{background:var(--soft);border-style:dashed}
.atile .pbgo{min-height:36px;padding:0 12px;border-radius:9px;background:var(--ink);color:var(--card);border:0;font-size:14px}
</style>

<body>

  <div class="top"><h1>Längt's?<span>Basel</span></h1><span class="status" id="st"></span></div>
  <button type="button" id="sum" class="sum" hidden><span id="sumt"></span><span class="edit">Ändern</span></button>
  <form id="f" autocomplete="off">
    <label class="fl" for="from">Von</label>
    <div class="row"><input id="from" list="stations" placeholder="Haltestelle oder Standort"><button type="button" class="swap" id="swap" aria-label="Von und Nach tauschen">⇅</button></div>

    <label class="fl" for="to">Nach</label>

    <div class="manage" id="manage" hidden><button type="button" id="editBtn">Verlauf bearbeiten</button><button type="button" id="clearBtn" hidden>Alle löschen</button></div>

<main>
  <div id="side">
    <section id="hero" aria-live="polite"></section>
    <div class="seg" id="seg" role="tablist" hidden><button type="button" data-v="plan" role="tab">Plan</button><button type="button" data-v="map" role="tab" class="mapbtn">Karte</button><button type="button" data-v="alt" role="tab" id="altbtn">Alternativen</button></div>
    <section id="focus"></section>
    <section id="alts"></section>
    <section id="list"><p class="empty">Ziel antippen oder eingeben – den Start findet «📍 in meiner Nähe».</p></section>
  </div>
  <div id="map" aria-label="Karte mit den Fahrzeugen der gewählten Verbindung"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
window.addEventListener('error',e=>{const s=document.getElementById('st');if(s)s.textContent='Fehler: '+(e.message||'Skript');});
window.addEventListener('unhandledrejection',e=>{const s=document.getElementById('st');if(s)s.textContent='Fehler: '+((e.reason&&e.reason.message)||e.reason);});
{
const API='https://transport.opendata.ch/v1/';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=s=>{if(!s)return null;const v=Date.parse(String(s).replace(/([+-]\d\d)(\d\d)$/,'$1:$2'));return isNaN(v)?null:v/1000};
const now=()=>Date.now()/1000;
const TZ={timeZone:'Europe/Zurich'};
const hhmm=d=>d.toLocaleTimeString('de-CH',{...TZ,hour:'2-digit',minute:'2-digit',hour12:false});
const hm=t=>t==null?'–':hhmm(new Date(t*1000));
const ymd=d=>new Intl.DateTimeFormat('sv-SE',{...TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const dep=p=>p?(T(p.prognosis&&p.prognosis.departure)??(p.departureTimestamp!=null?p.departureTimestamp+(p.delay||0)*60:null)):null;
const arr=p=>p?(T(p.prognosis&&p.prognosis.arrival)??(p.arrivalTimestamp!=null?p.arrivalTimestamp+(p.delay||0)*60:null)):null;
const stn=p=>p&&(p.station||p.location)||{};
const ll=p=>{const c=stn(p).coordinate||{};const a=+c.x,b=+c.y;return a&&b&&isFinite(a)&&isFinite(b)?[Math.max(a,b),Math.min(a,b)]:null};
const short=n=>String(n||'').replace(/^Basel,\s*/,'');
const vkey=r=>(r.journey.name||r.journey.number)+'@'+(r.departure&&r.departure.departureTimestamp);
const ckey=c=>(c.sections||[]).filter(s=>s.journey).map(vkey).join('|');
const lvl=b=>b==null?'direct':b<0?'bad':b<120?'warn':'ok';
const LV={ok:'Längt',warn:'Knapp',bad:'Längt nid',direct:'Direkt'};
const DV={ok:'Längt',renn:'Renn!',bad:'Längt nid'};
const LC={ok:'#1f9d55',warn:'#e0a100',bad:'#d23b2f',direct:'#69726d'};
const hav=(a,b)=>{const R=6371e3,r=Math.PI/180,dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;const h=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const plat=p=>String(p&&(p.platform||(p.prognosis&&p.prognosis.platform))||'').trim();
const xferNeed=(a,d)=>{const sa=String(stn(a).id||''),sd=String(stn(d).id||'');if(!sa||sa!==sd)return 180;const pa=plat(a),pd=plat(d);return pa&&pd&&pa!==pd?60:0};
const bufTxt=b=>b==null?'?':b<0?`${Math.ceil(-b/60)} Min. zu spät`:b<60?'sofort umsteigen':`${Math.floor(b/60)} Min. Puffer`;
const dark=()=>{const t=document.documentElement.dataset.theme;return t==='dark'||(t!=='light'&&!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))};
const ACC=()=>dark()?'#8ea6c4':'#5b7798',PBC=()=>dark()?'#6f7773':'#9aa19d';
const ICON={T:'<svg viewBox="0 0 24 24"><path d="M9 0h6v2H9zM7 3h10a2 2 0 0 1 2 2v10a3 3 0 0 1-2 2.8l1.5 2.2H16l-1.3-2H9.3L8 20H5.5L7 17.8A3 3 0 0 1 5 15V5a2 2 0 0 1 2-2zm0 3v5h10V6zm1.5 7.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm7 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>',
  B:'<svg viewBox="0 0 24 24"><path d="M6 2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-1 1.7V20h-2.5v-2h-9v2H5v-2.3A2 2 0 0 1 4 16V4a2 2 0 0 1 2-2zm0 3v6h12V5zm1.5 8a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm9 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg>'};
const WALK='<svg viewBox="0 0 24 24"><circle cx="13.5" cy="3.8" r="2.1"/><path d="M10.2 7.2 6.5 9v4h2v-2.7l1.4-.6-2 9.8H10l1.3-5.6 2.2 2.1V21h2v-5.8l-2.3-2.2.7-3.2a6 6 0 0 0 4.1 2.2v-2a4 4 0 0 1-3.2-2l-1-1.6a2.2 2.2 0 0 0-2.8-.8z"/></svg>';
const mins=s=>Math.max(1,Math.round(s/60));
const icon=r=>/^(B|NFB|BUS|KB)$/i.test(r.journey.category||'')?ICON.B:ICON.T;
const st={tn:0,userMoved:0,routePts:[],walkFallback:false,raw:[],from:'',to:'',time:new Date(),conns:[],selKey:null,demo:false,live:false,updated:0,planB:null,me:null,
  prog:new Map(),fitKey:'',veh:[],band:[],busy:false,pending:false,appr:new Map(),orig:new Map()};

function walkSec(s){
  const a=s.departure&&s.departure.departureTimestamp,b=s.arrival&&s.arrival.arrivalTimestamp;
  if(a&&b&&b>a)return b-a;
  const d=s.walk&&s.walk.duration;if(d==null)return 120;
  if(typeof d==='number')return d>=60?d:d*60;
  const p=String(d).split(/[:d]/).map(Number).slice(-3);return (p[0]||0)*3600+(p[1]||0)*60+(p[2]||0);
}
function analyse(c){
  const rides=[],xfers=[],walks=[];let walk=0,last=null,valid=true,maxWalk=0,walkTotal=0;
  for(const s of c.sections||[]){
    if(s.journey){
      if(last){
        const a=arr(last.arrival),d=dep(s.departure);
        const pa=last.arrival&&last.arrival.arrivalTimestamp,pd=s.departure&&s.departure.departureTimestamp;
        if(pa&&pd&&pd+60<pa)valid=false;
        const same=stn(last.arrival).id&&stn(last.arrival).id===stn(s.departure).id;
        const need=walk||xferNeed(last.arrival,s.departure);
        xfers.push({at:stn(s.departure).name||'',atId:stn(s.departure).id,fromAt:stn(last.arrival).name||'',walk,from:last,to:s,arr:a,dep:d,need,buf:a!=null&&d!=null?d-a-need:null});
      }
      rides.push(s);last=s;walk=0;
    } else {const w=walkSec(s);walk+=w;walkTotal+=w;maxWalk=Math.max(maxWalk,w);walks.push(s)}
  }
  if(!rides.length)valid=false;
  let reach=null;
  if(st.me&&rides[0]){const p=ll(rides[0].departure),d=dep(rides[0].departure);if(p&&d){const m=hav(st.me,p)*1.3;reach={m,buf:d-now()-m/1.25}}}
  const bufs=xfers.map(x=>x.buf).filter(b=>b!=null);if(reach)bufs.push(reach.buf);
  const min=bufs.length?Math.min(...bufs):null;
  return {rides,xfers,walks,reach,min,level:lvl(min),valid,maxWalk,walkTotal};
}
function tidy(list,keep,walkMode){
  const D=o=>dep(o.c.from)??0,A=o=>arr(o.c.to)??0;
  const all=list.map(c=>({c,a:analyse(c),k:ckey(c)})).filter(o=>o.a.valid||o.k===keep);
  let b;
  if(walkMode)b=all.filter(o=>o.a.walkTotal>0);
  else{const noW=all.filter(o=>o.a.walkTotal===0||o.k===keep);
    if(keep!==undefined)st.walkFallback=!noW.length&&all.length>0;b=noW.length?noW:all}
  const seen=new Set();b=b.filter(o=>!seen.has(o.k)&&seen.add(o.k));
  b=b.filter(o=>o.k===keep||!b.some(p=>p!==o&&D(p)>=D(o)&&A(p)<=A(o)&&(D(p)>D(o)||A(p)<A(o)||p.a.walkTotal<o.a.walkTotal)));
  b.sort((x,y)=>D(x)-D(y)||A(x)-A(y));
  return b.slice(0,6).map(o=>o.c);
}
/* Fussweg-Varianten der Hauptsuche, die früher ankommen als die gewählte Verbindung */
function walkOpts(sel){
  if(!sel||!st.raw.length)return[];
  const t=now();
  return tidy(st.raw,undefined,true).filter(c=>{const d=dep(c.from);return d!=null&&d>=t-30}).slice(0,3);
}
function selIndex(){const i=st.conns.findIndex(c=>ckey(c)===st.selKey);return i<0?0:i}

async function getJSON(url){
  const ac=typeof AbortController!=='undefined'?new AbortController():null;
  const to=setTimeout(()=>ac&&ac.abort(),8000);
  try{const r=await fetch(url,ac?{signal:ac.signal}:{});if(!r.ok){const e=new Error('HTTP '+r.status);e.http=r.status;throw e}return await r.json()}
  finally{clearTimeout(to)}
}

/* ---------- Fusswege durch Tram/Bus ersetzen (Abfahrtstafel) ---------- */
const BC=new Map();
function board(id,t){
  const b=Math.floor(t/300),k=id+'|'+b,c=BC.get(k);
  if(c&&now()-c.at<90)return c.p;
  const d=new Date(b*300*1000);
  const p=getJSON(API+'stationboard?'+new URLSearchParams({id,limit:'40',datetime:ymd(d)+' '+hhmm(d)})).then(j=>j.stationboard||[]).catch(()=>[]);
  BC.set(k,{at:now(),p});return p;
}
function secFromBoard(e,j){
  const pl=e.passList.slice(0,j+1);
  if(e.stop)pl[0]=Object.assign({},pl[0],e.stop);
  return{journey:{name:e.name,category:e.category,number:e.number,to:e.to,passList:pl},departure:pl[0],arrival:pl[j]};
}
async function hops(A,B,t,n=1,span=2){
  const found=[],seen=new Set();
  for(let k=0;k<span&&found.length<n;k++){
    const L=await board(A,t+k*900);
    for(const e of L){const d=dep(e.stop);if(d==null||d<t||d>t+30*60)continue;
      const j=(e.passList||[]).findIndex((p,i)=>i>0&&String(stn(p).id)===B);
      if(j>0){const s=secFromBoard(e,j),v=vkey(s),aa=arr(s.arrival);if(aa==null||aa-d>60*60)continue;if(!seen.has(v)){seen.add(v);found.push(s)}}}
  }
  return found.sort((x,y)=>dep(x.departure)-dep(y.departure)).slice(0,n);
}
async function rebuild(c,t0){
  const out=[];let t=t0;
  for(const s of c.sections||[]){
    const A=String(stn(s.departure).id||''),B=String(stn(s.arrival).id||'');
    if(!s.journey&&(A===B||!A||!B))continue;
    const xf=out.length?xferNeed(out[out.length-1].arrival,s.departure):0;
    if(s.journey&&dep(s.departure)!=null&&dep(s.departure)>=t+xf){out.push(s);t=arr(s.arrival)??t;continue}
    const [hp]=await hops(A,B,t+xf);
    if(!hp){if(s.journey)return null;out.push(s);t+=walkSec(s);continue}
    out.push(hp);t=arr(hp.arrival)??t;
  }
  if(!out.length||out.every(s=>!s.journey))return null;
  const d0=dep(out[0].departure),a1=arr(out[out.length-1].arrival);if(d0==null||a1==null||a1-d0>2*3600||a1<d0)return null;
  return{from:out[0].departure,to:out[out.length-1].arrival,sections:out,built:true};
}
async function buildRoutes(raw){
  if(!raw.length)return[];
  const t=now(),O=String(stn(raw[0].from).id||''),Z=String(stn(raw[0].to).id||'');
  const jobs=raw.filter(c=>analyse(c).walkTotal>0).slice(0,8).map(c=>{
    const f=(c.sections||[])[0],t0=Math.max(t-30,(dep(c.from)??t)-(f&&!f.journey?walkSec(f):0));
    return rebuild(c,t0).catch(()=>null)});
  /* direkte Fahrten Start -> Ziel */
  if(O&&Z)jobs.push(hops(O,Z,t-30,5,3).then(L=>L.map(s=>({from:s.departure,to:s.arrival,sections:[s],built:true}))).catch(()=>[]));
  return (await Promise.all(jobs)).flat().filter(Boolean);
}
async function load(fresh){
  if(st.busy){if(fresh)st.pending=true;return}
  st.busy=true;
  try{
    if(fresh){st.time=new Date();st.selKey=null;st.builtAt=0;st.built=[];st.prog.clear();st.fitKey='';st.appr.clear();st.planB=null}
    setStatus('Lade …');
    if(!st.demo){
      const q=new URLSearchParams({from:st.from,to:st.to,limit:'10',date:ymd(st.time),time:hhmm(st.time)});
      try{const j=await getJSON(API+'connections?'+q);let raw=j.connections||[];
        /* Liste auffüllen, damit immer genug kommende Verbindungen da sind */
        const up=tidy(raw,undefined).filter(c=>(dep(c.from)??0)>now()).length;
        if(up<4&&raw.length){const last=Math.max(...raw.map(c=>c.from&&c.from.departureTimestamp||0));
          if(last){const d2=new Date((last+60)*1000);try{const j2=await getJSON(API+'connections?'+new URLSearchParams({from:st.from,to:st.to,limit:'10',date:ymd(d2),time:hhmm(d2)}));raw=raw.concat(j2.connections||[])}catch(e){}}}
        if(fresh)setStatus('Suche Tram-Verbindungen …');
        if(fresh||!st.builtAt||now()-st.builtAt>90){try{st.built=await buildRoutes(raw)}catch(e){st.built=[]}st.builtAt=now()}
        st.raw=raw;st.conns=tidy(raw.concat(st.built||[]),st.selKey);st.live=true;addTiles()}
      catch(e){
        if(e.http){setStatus(`Fehler ${e.http} – API nicht erreichbar oder Limit erreicht`);return}
        if(st.live){setStatus('Keine Verbindung zur API – zeige letzten Stand');return}
        st.demo=true;$('#demo').classList.add('on');
      }
    }
    if(st.demo){st.raw=demoConns();st.conns=st.raw}
    if(fresh&&st.conns.length)compact(true);
    if(!st.conns.some(c=>ckey(c)===st.selKey))st.selKey=st.conns[0]?ckey(st.conns[0]):null;
    st.updated=now();
    render();
    await Promise.all([loadPlanB(),loadApproaches()]);
    render();
  }finally{
    st.busy=false;
    if(st.pending){st.pending=false;load(true)}
  }
}

async function loadPlanB(){
  const c=st.conns[selIndex()];if(!c){st.planB=null;return}
  const x=analyse(c).xfers[0];if(!x||x.arr==null){st.planB=null;return}
  let raw;
  if(st.demo)raw=demoPlanB();
  else{
    const d=new Date(x.arr*1000);
    const q=new URLSearchParams({from:x.atId||x.at,to:st.to,limit:'10',date:ymd(d),time:hhmm(d)});
    try{raw=(await getJSON(API+'connections?'+q)).connections||[]}catch(e){return}
  }
  const orig=vkey(x.to);
  const rides=[],walks=[];
  for(const k of raw){
    const a=analyse(k);if(!a.valid||!a.rides.length)continue;
    const r=a.rides[0],first=(k.sections||[])[0];
    if(a.walkTotal===0&&first&&first.journey){
      const buf=dep(r.departure)-x.arr-xferNeed(x.from.arrival,r.departure);
      if(vkey(r)!==orig&&buf>=0)rides.push({k,r,buf});
    } else walks.push({k,a});
  }
  rides.sort((p,q)=>dep(p.r.departure)-dep(q.r.departure));
  const seen=new Set(),list=rides.filter(o=>{const s=vkey(o.r);return!seen.has(s)&&seen.add(s)}).slice(0,3);
  const bestArr=list.length?arr(list[0].k.to):Infinity;
  /* Fussweg-Alternativen nur, wenn sie früher ankommen als das erste Tram von Plan B */
  const wk=walks.filter(o=>{const d=dep(o.k.from),a=arr(o.k.to);return d!=null&&d>=x.arr&&a!=null&&a<bestArr-60})
    .sort((p,q)=>arr(p.k.to)-arr(q.k.to)).slice(0,1);
  /* ganz zu Fuss ans Ziel */
  let foot=null;const p1=ll(x.to.departure),p2=ll(c.to);
  if(p1&&p2){const m=hav(p1,p2)*1.3,s=m/1.25,a=x.arr+s;if(m<=1600&&a<bestArr-60)foot={m,s,a,to:stn(c.to).name}}
  st.planB={x,list,walk:wk,foot};
}

/* Anfahrt: Haltestellen VOR dem Einstieg, über die Gegenrichtung an der Endhaltestelle */
async function loadApproaches(){
  if(st.demo)return;
  const c=st.conns[selIndex()];if(!c)return;
  await Promise.all((c.sections||[]).filter(s=>s.journey).map(r=>loadApproach(r).catch(()=>{})));
}
async function loadApproach(r){
  const d=dep(r.departure),dp=r.departure&&r.departure.departureTimestamp;if(!d||!dp)return;
  if(d<now()-60||d-now()>50*60)return;
  const j=r.journey,bName=stn(r.departure).name,bId=String(stn(r.departure).id||'');
  const same=e=>String(e.number)===String(j.number)&&e.category===j.category;
  const hasB=pl=>(pl||[]).findIndex(p=>String(stn(p).id)===bId);
  /* 1) Startpunkt: an der Zielhaltestelle das Fahrzeug derselben Linie suchen, das in Gegenrichtung DURCH deine Haltestelle fährt */
  const okey=j.category+j.number+'>'+j.to+'@'+bId;
  let o=st.orig.get(okey);
  if(o===undefined){
    o=null;
    try{
      const f=['number','category','to','passList/station/id','passList/departureTimestamp','passList/arrivalTimestamp'].map(x=>'&fields[]=stationboard/'+x).join('');
      const sb=await getJSON(API+'stationboard?'+new URLSearchParams({station:j.to,limit:'30'})+f);
      const m=(sb.stationboard||[]).find(e=>same(e)&&hasB(e.passList)>=0);
      if(m){const pl=m.passList,i=hasB(pl),last=pl[pl.length-1];
        const travel=(last.arrivalTimestamp&&pl[i].departureTimestamp)?last.arrivalTimestamp-pl[i].departureTimestamp:30*60;
        o={origin:m.to,travel:Math.max(0,travel)}}
    }catch(e){}
    st.orig.set(okey,o);
  }
  if(!o||!o.origin||o.origin===bName)return;
  /* 2) Abfahrtstafel am Startpunkt: dieselbe Fahrt (gleicher Name) mit allen Haltestellen + Prognosen */
  const t0=new Date((dp-o.travel-12*60)*1000);
  try{
    const sb=await getJSON(API+'stationboard?'+new URLSearchParams({station:o.origin,limit:'25',datetime:ymd(t0)+' '+hhmm(t0)})+'&fields[]=stationboard/name&fields[]=stationboard/number&fields[]=stationboard/category&fields[]=stationboard/passList');
    const m=(sb.stationboard||[]).find(e=>same(e)&&e.name===j.name);
    if(m){const i=hasB(m.passList);if(i>0){st.appr.set(vkey(r),m.passList.slice(0,i+1));return}}
  }catch(e){}
  /* 3) Rückfall: Verbindungssuche Startpunkt → deine Haltestelle mit Ankunftszeit */
  const q=new URLSearchParams({from:o.origin,to:bId||bName,limit:'8',isArrivalTime:'1',date:ymd(new Date(dp*1000)),time:hhmm(new Date((dp+120)*1000))});
  const res=await getJSON(API+'connections?'+q);
  for(const k of res.connections||[])for(const s of k.sections||[]){
    if(s.journey&&s.journey.name===j.name&&String(s.journey.number)===String(j.number)){
      const pl=s.journey.passList||[],i=hasB(pl);
      if(i>0){st.appr.set(vkey(r),pl.slice(0,i+1));return}
    }
  }
}

/* Haltestellenliste eines Fahrzeugs: Anfahrt + eigene Strecke; b = Index deines Einstiegs */
function listFor(r){
  const a=st.appr.get(vkey(r))||[];
  const pl=[...a.slice(0,-1),r.departure,...(r.journey.passList||[]).slice(1,-1),r.arrival].filter(p=>ll(p));
  return {pl,b:Math.max(0,pl.indexOf(r.departure))};
}
function pos(r){
  const {pl,b}=listFor(r),n=pl.length-1;if(n<1)return null;
  const t=now(),tA=i=>arr(pl[i])??dep(pl[i]),tD=i=>dep(pl[i])??arr(pl[i]);
  const tb=dep(r.departure),waitMin=tb!=null&&t<tb?Math.max(0,Math.ceil((tb-t)/60)):null;
  let prog=n;
  if(tD(0)!=null&&t<tD(0))prog=0;
  else if(!(tA(n)!=null&&t>=tA(n)))for(let i=0;i<n;i++){
    if(t<tD(i)){prog=i;break}
    if(t<tA(i+1)){prog=i+(t-tD(i))/Math.max(1,tA(i+1)-tD(i));break}
  }
  const key=vkey(r),old=st.prog.get(key);if(old!=null&&prog<old&&old-prog<1.5)prog=old;st.prog.set(key,prog);
  const i=Math.min(Math.floor(prog),n-1),f=Math.min(1,prog-i),A=ll(pl[i]),B=ll(pl[i+1]);
  return{p:[A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f],prog,b,n,pl,waitMin,done:tA(n)!=null&&t>=tA(n)+60};
}

function render(){

function head(c,a){

}

function card(c,a,sel,best){
  const chips=(c.sections||[]).map(s=>s.journey?`<span class="chip" title="Richtung ${esc(s.journey.to)}">${esc(s.journey.category)} ${esc(s.journey.number||'')}</span>`

  return `<article tabindex="0" class="${sel?'sel':''}" data-k="${esc(ckey(c))}">
  <div class="r1">${head(c,a)}${best?'<span class="tag">Empfohlen</span>':''}<span class="pill ${a.level}" title="Umstieg">${a.level==='direct'?'Direkt':'Umstieg: '+LV[a.level]}</span></div>
  <div class="legs">${chips}<span>ab ${esc(short(stn(c.from).name))}</span></div>${xf}</article>`;

/* ---------- Abfahrts-Ampel: Längt / Renn! / Längt nid ---------- */
function depStatus(c,a){
  const r0=a&&a.rides[0];if(!r0)return null;
  const tb=dep(r0.departure),t=now();if(tb==null)return null;
  const first=(c.sections||[])[0],stop=ll(r0.departure);
  let need=0,src='';
  if(st.me&&stop){const m=hav(st.me,stop)*1.3;need=m/1.25+20;src='gps';if(m<60)need=0}
  else if(first&&!first.journey){need=walkSec(first);src='walk'}
  if(t>tb+20){
    if(st.me){const P=pos(r0);if(P&&P.p&&hav(st.me,P.p)<250)return{boarded:true,r0}
      return{level:'bad',gone:true,slack:tb-t-need,need,src,r0,tb}}
    return{boarded:true,r0}
  }
  const slack=tb-t-need;
  return{level:slack>=120?'ok':slack>=0?'renn':'bad',slack,need,src,r0,tb};
}
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function nextOk(){
  for(const c of st.conns){const a=analyse(c),d=depStatus(c,a);if(d&&!d.boarded&&d.level!=='bad'&&ckey(c)!==st.selKey)return{c,a,d}}
  return null;
}

    const cd=d.level==='bad'?(d.gone?'weg':'zu spät'):d.slack<120?mmss(d.slack):Math.floor(d.slack/60)+' Min.';

  }

    if((L==='bad'||L==='warn')&&st.planB&&st.planB.list.length){const o=st.planB.list[0];
      xr+=`<div class="alt">${L==='bad'?'Nimm stattdessen':'Falls verpasst'}: ${LN(o.r)} <b>${hm(dep(o.r.departure))}</b> ab ${esc(short(st.planB.x.at))} · an ${hm(arr(o.k.to))}</div>`}

    if(w)tip=`<div class="tip">${WALK}<span>Mit Fussweg <b>${Math.round((arr(c.to)-arr(w.to))/60)} Min. früher</b>: ${lnsOf(w)} an ${hm(arr(w.to))}</span><button type="button" data-view="alt">Ansehen</button></div>`}
  const html=`<div class="hero ${cls}">${top}${xr}${tip}<div class="arrrow"><span>Ankunft ${esc(short(stn(c.to).name))}</span><b>${hm(arr(c.to))}</b></div></div>`;
  if(html!==st.heroSig){H.innerHTML=html;st.heroSig=html}
  /* Renn!: gelb blinken + vibrieren, einmal beim Wechsel */

  if(lv==='renn'&&(st.lastDep!=='renn'||st.lastDepKey!==st.selKey)){

  }
  st.lastDep=lv;st.lastDepKey=st.selKey;

function renderFocus(c,a){
  const F=$('#focus');st.band=[];
  if(!c||!a){F.innerHTML='';renderAlts(null,null);return}
  const parts=[];let k=-1;
  (c.sections||[]).forEach(s=>{
    if(!s.journey){
      const m=mins(walkSec(s)),to=esc(short(stn(s.arrival).name));
      parts.push(`<div class="tile walk"><span class="tic">${WALK}</span><div class="tb"><div class="tt">${m} Min. zu Fuss</div><div class="ts">${k<0?'zur Haltestelle':'bis'} ${to}</div></div>${k<0?`<div class="tr">${hm(dep(s.departure))}<small>los</small></div>`:''}</div>`);
      return;
    }
    k++;const r=s;
    parts.push(`<div class="tile ride" data-i="${k}"><div class="th">${LN(r,'big')}<div class="tb"><div class="tt">${esc(short(stn(r.departure).name))} → ${esc(short(stn(r.arrival).name))}</div><div class="ts">${isBus(r)?'Bus':'Tram'} Richtung ${esc(short(r.journey.to))}</div></div>
      <div class="tr">${hm(dep(r.departure))}<small>an ${hm(arr(r.arrival))}</small></div></div><div class="now"></div><div class="track"></div></div>`);
    const x=a.xfers[k];

      parts.push(`<div class="tile xfer ${L}"><div class="tb"><div class="ts">Umsteigen${wk?' · '+mins(x.walk)+' Min. zu Fuss':''}</div><div class="tt">${wk?esc(short(x.fromAt))+' → '+esc(short(x.at)):esc(short(x.at))}</div></div><div class="tr">${LV[L]}<small>${bufTxt(x.buf)}</small></div></div>`)}
  });
  parts.push(`<div class="tile end"><span class="tic"></span><div class="tb"><div class="ts">Ankunft</div><div class="tt">${esc(short(stn(c.to).name))}</div></div><div class="tr">${hm(arr(c.to))}</div></div>`);
  F.innerHTML='<div class="tiles">'+parts.join('<i class="tarrow"></i>')+'</div>';
  F.querySelectorAll('.tile.ride').forEach(el=>{const r=a.rides[+el.dataset.i];st.band.push({r,track:el.querySelector('.track'),now:el.querySelector('.now'),sig:'',dot:null})});
  renderAlts(c,a);
  tick();
}

const xpos=(i,b,n)=>{const A=b>0?30:0;return b>0&&i<=b?A*i/b:A+(100-A)*(i-b)/Math.max(1,n-b)};

  const first=a.rides[0],lastR=a.rides[a.rides.length-1];
  if(first&&ll(first.departure))label(ll(first.departure),short(stn(first.departure).name));
  a.xfers.forEach(x=>{const p=ll(x.to.departure);if(!p)return;L.circleMarker(p,{radius:10,color:LC[lvl(x.buf)],weight:2.5,fill:false,interactive:false}).addTo(layer);label(p,'Umstieg '+short(x.at))});
  if(lastR&&ll(lastR.arrival))label(ll(lastR.arrival),short(stn(lastR.arrival).name));
  if(st.me)L.circleMarker(st.me,{radius:7,color:'#fff',weight:3,fillColor:'#1e5bd6',fillOpacity:1,interactive:false}).addTo(layer);
  st.routePts=pts.slice();
  const fk=st.selKey+'|'+nAppr;
  if(pts.length&&st.fitKey!==fk){map.fitBounds(pts,{padding:[36,36],maxZoom:16});st.fitKey=fk}
  tick();
}

function tick(){
  for(const v of st.veh){
    const el=v.m.getElement();if(!el)continue;const box=el.firstChild,P=pos(v.r);
    if(!P||P.done){el.style.display='none';continue}
    el.style.display='';v.m.setLatLng(P.p);v.lastP=P.p;
    const b=box.querySelector('i'),txt=P.waitMin!=null?`${P.waitMin}'`:'';
    if(b&&b.textContent!==txt)b.textContent=txt;
    box.classList.toggle('wait',P.b===0&&P.waitMin!=null);
  }
  if(map&&++st.tn%3===0&&now()-st.userMoved>25){
    const vis=st.veh.filter(v=>!v.ghost&&v.lastP&&v.m.getElement()&&v.m.getElement().style.display!=='none');
    const bb=map.getBounds().pad(-0.08);
    if(vis.some(v=>!bb.contains(v.lastP))){st.autoFit=true;map.fitBounds([...(st.routePts||[]),...vis.map(v=>v.lastP)],{padding:[36,36],maxZoom:16,animate:true})}
  }
  for(const o of st.band){
    const P=pos(o.r);if(!P)continue;
    const sig=P.n+'|'+P.b;if(o.sig!==sig){drawTrack(o,P);o.sig=sig}
    o.dot.style.left=xpos(P.prog,P.b,P.n)+'%';
    o.dot.classList.toggle('unk',P.b===0&&P.waitMin!=null);
    const s=legStatus(P,o.r);if(o.now.innerHTML!==s)o.now.innerHTML=s;
  }
  renderHero();
  if(st.updated&&!st.busy)setStatus(st.demo?'<b>Demo</b>':`<b>Live</b> · vor ${Math.round(now()-st.updated)} s`);
}
function setStatus(h){$('#st').innerHTML=h}

/* Demo-Daten im Format von transport.opendata.ch, Zeiten relativ zu jetzt */
const S={NEU:['Basel, Neuweilerstrasse','8589110',47.5555,7.5655],ALL:['Basel, Allschwilerplatz','8589293',47.557241,7.570579],BRA:['Basel, Brausebad','8581062',47.555537,7.575861],SCH:['Basel, Schützenhaus','8589360',47.553203,7.577092],ZOO:['Basel, Zoo Bachletten','8589381',47.550881,7.580451],HEU:['Basel, Heuwaage','8500079',47.551269,7.588051],THE:['Basel, Theater','8500994',47.553124,7.589776],BAR:['Basel, Barfüsserplatz','8500897',47.554591,7.589057],BAN:['Basel, Bankverein','8500896',47.55365,7.59245],KUN:['Basel, Kunstmuseum','8500893',47.5547,7.5944],WET:['Basel, Wettsteinplatz','8500898',47.5596,7.5961]};
const T0=Math.floor(now()/60)*60;
const iso=t=>new Date(t*1000).toISOString();
function dpass(k,m,d){const[name,id,x,y]=S[k],ts=T0+m*60;return{station:{id,name,coordinate:{type:'WGS84',x,y}},arrivalTimestamp:ts,departureTimestamp:ts,delay:d,prognosis:{arrival:iso(ts+d*60),departure:iso(ts+d*60)}}}
function dride(cat,num,to,stops,d){const pl=stops.map(([k,m])=>dpass(k,m,d));return{journey:{name:cat+num+'-'+stops[0][1],category:cat,number:num,to,passList:pl},departure:pl[0],arrival:pl[pl.length-1]}}
function dconn(...rides){return{from:rides[0].departure,to:rides[rides.length-1].arrival,sections:rides}}
const six=(o,d)=>dride('T','6','Riehen Grenze',[['ALL',o-4],['BRA',o-2],['SCH',o-1],['ZOO',o+1],['HEU',o+3],['THE',o+4],['BAR',o+5]],d);
const two=(o,d)=>dride('T','2','Eglisee',[['BAR',o],['BAN',o+1],['KUN',o+2],['WET',o+5]],d);
function demoConns(){
  const c=[dconn(six(0,3),two(8,0)),dconn(six(8,0),two(18,1)),dconn(six(15,1),two(25,0))];
  /* Demo-Anfahrt: 2er kommt vom Theater her, 6er der zweiten Verbindung von der Neuweilerstrasse */
  st.appr.set(vkey(c[0].sections[1]),[dpass('HEU',3,0),dpass('THE',5,0),dpass('BAR',8,0)]);
  st.appr.set(vkey(c[1].sections[0]),[dpass('NEU',-2,0),dpass('ALL',4,0)]);
  return c;
}
function demoPlanB(){return[dconn(two(15,0)),dconn(two(22,1))]}

/* Bedienung */
const F=$('#from'),To=$('#to'),MAIN=$('main');
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let hist=LS.get('lg-hist',null);
if(!hist){hist=[];try{const f=localStorage.getItem('rb-from'),t=localStorage.getItem('rb-to');if(f&&t)hist.push({f,t,n:1,ts:Date.now()})}catch(e){}}
function remember(f,t){let e=hist.find(x=>x.f===f&&x.t===t);if(!e){e={f,t,n:0,ts:0};hist.push(e)}e.n++;e.ts=Date.now();
  hist=hist.sort((a,b)=>b.ts-a.ts).slice(0,40);LS.set('lg-hist',hist)}
const score=e=>e.n+3*Math.exp(-(Date.now()-e.ts)/(7*864e5));
function topBy(key,excl){const m=new Map();for(const e of hist){const v=e[key];if(v===excl)continue;m.set(v,(m.get(v)||0)+score(e))}return[...m].sort((a,b)=>b[1]-a[1]).map(x=>x[0])}
const chip=(attrs,html,cls='',del='')=>`<button type="button" class="chip2 ${cls}" ${attrs}${del?` data-del="${esc(del)}"`:''}>${html}${del?'<span class="x" aria-label="löschen">×</span>':''}</button>`;
function forget(kind,v){
  if(kind==='f')hist=hist.filter(e=>e.f!==v);
  else if(kind==='t')hist=hist.filter(e=>e.t!==v);
  else{const[f,t]=v.split('\u2192');hist=hist.filter(e=>!(e.f===f&&e.t===t))}
  LS.set('lg-hist',hist);renderChips();
}
function renderChips(){
  const fv=F.value.trim(),tv=To.value.trim();
  let fc='';
  if(st.near&&st.near.length)fc+=st.near.slice(0,4).map((s,i)=>chip(`data-set="from" data-v="${esc(s.name)}"`,`${i===0?'📍 ':''}${esc(short(s.name))} <small>${s.distance} m</small>`,(i===0?'loc ':'')+(fv===s.name?'on':''))).join('');
  else fc+=chip('data-act="locate"',st.locMsg||'📍 Haltestellen in meiner Nähe','loc');
  fc+=topBy('f').filter(n=>!(st.near||[]).some(s=>s.name===n)).slice(0,4).map(n=>chip(`data-set="from" data-v="${esc(n)}"`,esc(short(n)),fv===n?'on':'','f:'+n)).join('');
  $('#fromChips').innerHTML=fc;
  $('#toChips').innerHTML=topBy('t',fv).slice(0,6).map(n=>chip(`data-set="to" data-v="${esc(n)}"`,'★ '+esc(short(n)),tv===n?'on':'','t:'+n)).join('');
  const routes=[...hist].sort((a,b)=>score(b)-score(a)).slice(0,3);
  let rc=routes.map(e=>chip(`data-f="${esc(e.f)}" data-t="${esc(e.t)}"`,`${esc(short(e.f))} → ${esc(short(e.t))}`,'','r:'+e.f+'\u2192'+e.t)).join('');
  if(st.from&&st.to)rc=chip(`data-f="${esc(st.to)}" data-t="${esc(st.from)}"`,'↩ Rückweg')+rc;
  $('#routeChips').innerHTML=rc;
  $('#manage').hidden=!hist.length;if(!hist.length)$('#f').classList.remove('editing');
  $('#editBtn').textContent=$('#f').classList.contains('editing')?'Fertig':'Verlauf bearbeiten';$('#clearBtn').hidden=!$('#f').classList.contains('editing');
}
function go(){st.from=F.value.trim();st.to=To.value.trim();if(!st.from||!st.to)return;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  remember(st.from,st.to);load(true)}
function compact(on){$('#f').hidden=on;$('#sum').hidden=!on;$('#sumt').textContent=short(st.from)+' → '+short(st.to);if(!on)renderChips()}
$('#f').addEventListener('submit',e=>{e.preventDefault();go()});
$('#sum').addEventListener('click',()=>{compact(false)});
$('#f').addEventListener('click',e=>{
  if(e.target.closest('#editBtn')){$('#f').classList.toggle('editing');renderChips();return}
  if(e.target.closest('#clearBtn')){hist=[];LS.set('lg-hist',hist);try{localStorage.removeItem('rb-from');localStorage.removeItem('rb-to')}catch(_){}$('#f').classList.remove('editing');renderChips();return}
  const b=e.target.closest('.chip2');if(!b)return;
  if($('#f').classList.contains('editing')){if(b.dataset.del){const d=b.dataset.del,i=d.indexOf(':');forget(d.slice(0,i),d.slice(i+1))}return}
  if(b.dataset.act==='locate'){locate(true);return}
  if(b.dataset.f){F.value=b.dataset.f;To.value=b.dataset.t;go();return}
  if(b.dataset.set==='from'){F.value=b.dataset.v;renderChips();if(To.value.trim())go();else To.focus()}
  if(b.dataset.set==='to'){To.value=b.dataset.v;renderChips();if(F.value.trim())go();else F.focus()}
});
$('#swap').addEventListener('click',()=>{const v=F.value;F.value=To.value;To.value=v;renderChips()});
let acT;
const ac=e=>{renderChips();const v=e.target.value.trim();clearTimeout(acT);if(st.demo||v.length<2)return;
  acT=setTimeout(async()=>{try{const j=await getJSON(API+'locations?type=station&query='+encodeURIComponent(v));
    $('#stations').innerHTML=(j.stations||[]).filter(s=>s.id&&s.name).slice(0,8).map(s=>`<option value="${esc(s.name)}"></option>`).join('')}catch(_){}},250)};
F.addEventListener('input',ac);To.addEventListener('input',ac);
/* Fahrzeug-Auswahl, Hero-Knopf */
const selectKey=k=>{if(!k||k===st.selKey)return;st.selKey=k;st.planB=null;st.lastDep='';render();
  window.scrollTo({top:0,behavior:'smooth'});Promise.all([loadPlanB(),loadApproaches()]).then(render)};
const pick=el=>{const a=el.closest('article');if(!a)return;selectKey(a.dataset.k);setView('plan')};
$('#list').addEventListener('click',e=>pick(e.target));
$('#alts').addEventListener('click',e=>{const s=e.target.closest('button[data-sel]');if(s){selectKey(s.dataset.sel);setView('plan');return}
  const b=e.target.closest('button[data-wk]');if(!b)return;
  const k=(st.walkOptsCur||[]).find(c=>ckey(c)===b.dataset.wk);if(!k)return;
  if(!st.conns.some(c=>ckey(c)===b.dataset.wk)){st.conns.push(k);st.conns.sort((x,y)=>(dep(x.from)??0)-(dep(y.from)??0))}
  selectKey(b.dataset.wk)});
$('#list').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e.target)}});
$('#hero').addEventListener('click',e=>{const v=e.target.closest('button[data-view]');if(v){setView(v.dataset.view);return}const b=e.target.closest('button[data-k]');if(b)selectKey(b.dataset.k)});
/* Standort: nächste Haltestellen + Abfahrts-Ampel */
let watching=false;
function locate(manual){
  if(!navigator.geolocation){st.locMsg='Standort nicht verfügbar';renderChips();return}
  st.locMsg='📍 Suche Standort …';renderChips();
  const ok=async p=>{
    const first=!st.me;st.me=[p.coords.latitude,p.coords.longitude];
    if(first||!st.near){
      try{const j=await getJSON(API+'locations?'+new URLSearchParams({x:st.me[0],y:st.me[1],type:'station'}));
        st.near=(j.stations||[]).filter(s=>s.id&&s.name&&s.distance!=null);
        if(st.near[0]&&(manual||!F.value.trim())&&!$('#f').hidden){F.value=st.near[0].name;if(To.value.trim()&&manual)go();else To.focus()}
      }catch(e){}
    }
    st.locMsg='';renderChips();if(st.conns.length)render();
  };
  const fail=()=>{st.locMsg='📍 Standort nicht erlaubt';renderChips()};
  try{if(!watching){watching=true;navigator.geolocation.watchPosition(ok,e=>{watching=false;fail()},{enableHighAccuracy:true,maximumAge:10000,timeout:15000})}
    else navigator.geolocation.getCurrentPosition(ok,fail,{enableHighAccuracy:true,maximumAge:10000,timeout:15000})}catch(e){fail()}
}
try{navigator.permissions&&navigator.permissions.query({name:'geolocation'}).then(r=>{if(r.state==='granted')locate(false)}).catch(()=>{})}catch(e){}
/* Plan / Karte */
function setView(v){if(v==='map'&&matchMedia('(min-width:900px)').matches)v='plan';['plan','map','alt'].forEach(x=>MAIN.classList.toggle('v-'+x,v===x));
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===v)));
  LS.set('lg-view',v);if(v==='map'&&map){setTimeout(()=>{map.invalidateSize();st.fitKey='';if(st.cur&&st.cur.a)drawMap(st.cur.a)},30)}}
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});
setView(LS.get('lg-view','plan'));
setInterval(tick,1000);
setInterval(()=>{if(!document.hidden&&st.conns.length&&!st.demo)load(false)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st.conns.length&&!st.demo&&now()-st.updated>20)load(false)});
const last=[...hist].sort((a,b)=>b.ts-a.ts)[0];
if(last){F.value=last.f;To.value=last.t;st.from=last.f;st.to=last.t;load(true)}
else{renderChips();setStatus('')}
}
</script>
